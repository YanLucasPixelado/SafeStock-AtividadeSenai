{% extends 'nucleo/base.html' %}

{% block title %} Adicionar EPI {% endblock %}

{% block content %}
<div class="card-tela">
    <h1>Cadastro</h1>

    <form action="{% url 'nucleo-salvar-epi' %}" method="POST">
        {% csrf_token %}
        {% include 'nucleo/forms/_campos-epi.html' %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-outline-success flex-grow-1"> SALVAR </button>
            <a href="{% url 'nucleo-epis-home' %}" class="btn btn-outline-secondary"> Voltar </a>
        </div>
    </form>
</div>
{% endblock %}
